server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Security headers
    add_header X-Content-Type-Options  "nosniff"                always;
    add_header X-Frame-Options         "DENY"                   always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data:; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;

    # Fly.io health check
    location = /healthz {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # Static assets — cache 1 day
    location /assets/ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # JSON data — no cache (allow fresh content)
    location /data/ {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    # HTML, CSS — revalidate
    location ~* \.(html|css)$ {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    # Fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
}
